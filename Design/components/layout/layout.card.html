<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Panels & page header</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body { padding: 20px; background: var(--bg-app); }
  .row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
</style>
</head>
<body>

<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/pk-jsx">
    const NS = (function () {
  if (window.PanelKit && window.PanelKit.Button) return window.PanelKit;
  for (const k of Object.keys(window)) {
    try { const v = window[k]; if (v && typeof v === 'object' && v.Button && v.Panel) return v; } catch (e) {}
  }
  return {};
})();
  const Ico = ({ d, size = 15, w = 2 }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={w} strokeLinecap="round" strokeLinejoin="round">
      {d.map((p, i) => <path key={i} d={p} />)}
    </svg>
  );
  const UP = ['M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4', 'M7 10l5-5 5 5', 'M12 5v12'];
  const CHEV_L = ['m15 18-6-6 6-6'], CHEV_R = ['m9 18 6-6-6-6'];
  const OUT = ['M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4', 'm16 17 5-5-5-5', 'M21 12H9'];
  function Card() {
    const { Panel, PageHeader, Pill, Button, IconButton } = NS;
    return (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-5)' }}>
        <PageHeader badge={<Pill tone="accent" uppercase>Section 01 / 07</Pill>} meta="26 editable fields"
          title="Home" description="The landing page — brand marks, hero video, service cards and the main gallery."
          actions={<><IconButton label="Previous"><Ico d={CHEV_L} size={16} /></IconButton><Button iconRight={<Ico d={CHEV_R} size={16} />}>Next</Button></>} />
        <Panel title="Home gallery" meta="10 fields" note={<Pill>Rarely changed</Pill>}>
          <div style={{ height: 60, borderRadius: 'var(--radius-card)', border: '1px dashed var(--border-strong)' }} />
        </Panel>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script>
<script>
  /* Explicit transform so a failure surfaces with a real message instead of Babel's
     opaque auto-run "Script error." */
  (function () {
    var node = document.querySelector('script[type="text/pk-jsx"]');
    try {
      var js = Babel.transform(node.textContent, { presets: [['react', { runtime: 'classic' }]] }).code;
      new Function(js)();
    } catch (e) {
      console.error('[PanelKit] page script failed:', e && e.message, e);
      document.body.insertAdjacentHTML('beforeend', '<pre style="padding:16px;color:var(--accent-text);white-space:pre-wrap">' + (e && e.message) + '</pre>');
    }
  })();
</script>
</body>
</html>
