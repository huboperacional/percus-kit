<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar & nav items</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body { padding: 20px; background: var(--bg-app); }
  .row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
</style>
</head>
<body>

<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/pk-jsx">
    const NS = (function () {
  if (window.PanelKit && window.PanelKit.Button) return window.PanelKit;
  for (const k of Object.keys(window)) {
    try { const v = window[k]; if (v && typeof v === 'object' && v.Button && v.Panel) return v; } catch (e) {}
  }
  return {};
})();
  const Ico = ({ d, size = 15, w = 2 }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={w} strokeLinecap="round" strokeLinejoin="round">
      {d.map((p, i) => <path key={i} d={p} />)}
    </svg>
  );
  const UP = ['M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4', 'M7 10l5-5 5 5', 'M12 5v12'];
  const CHEV_L = ['m15 18-6-6 6-6'], CHEV_R = ['m9 18 6-6-6-6'];
  const OUT = ['M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4', 'm16 17 5-5-5-5', 'M21 12H9'];
  function Card() {
    const { Sidebar, NavItem, TextInput, Button, Pill } = NS;
    const items = [['Home', 26], ['Window Tint', 5], ['PPF', 5], ['Vinyl Wrap', 5], ['Ceramic Coating', 5], ['Auto Detail', 5], ['About', 2]];
    const [active, setActive] = React.useState('Home');
    return (
      <Sidebar
        brand={<div style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-3)', padding: '2px 4px' }}>
          <span style={{ width: 32, height: 32, borderRadius: 'var(--radius-input)', background: 'var(--accent)', color: 'var(--text-inverse)', display: 'grid', placeItems: 'center', fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 14 }}>A</span>
          <span style={{ display: 'flex', flexDirection: 'column', lineHeight: 1.15 }}>
            <span style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 14 }}>Workspace</span>
            <span style={{ fontSize: 'var(--text-2xs)', color: 'var(--text-tertiary)' }}>Content panel</span>
          </span>
        </div>}
        search={<TextInput pill placeholder="Search all fields" leadingIcon={
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8" /><path d="M21 21l-4.3-4.3" /></svg>} />}
        footer={<>
          <div style={{ background: 'var(--bg-inset)', borderRadius: 'var(--radius-tile)', padding: '12px 14px' }}>
            <div style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 'var(--text-xs)' }}>All changes published</div>
            <div style={{ fontSize: 'var(--text-2xs)', color: 'var(--text-tertiary)', marginTop: 2 }}>Last update today, 10:42 AM</div>
          </div>
          <Button align="left" icon={<Ico d={OUT} />}>Sign out</Button>
        </>}>
        {items.map(([label, count]) => <NavItem key={label} label={label} count={count} active={active === label} onClick={() => setActive(label)} />)}
      </Sidebar>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script>
<script>
  /* Explicit transform so a failure surfaces with a real message instead of Babel's
     opaque auto-run "Script error." */
  (function () {
    var node = document.querySelector('script[type="text/pk-jsx"]');
    try {
      var js = Babel.transform(node.textContent, { presets: [['react', { runtime: 'classic' }]] }).code;
      new Function(js)();
    } catch (e) {
      console.error('[PanelKit] page script failed:', e && e.message, e);
      document.body.insertAdjacentHTML('beforeend', '<pre style="padding:16px;color:var(--accent-text);white-space:pre-wrap">' + (e && e.message) + '</pre>');
    }
  })();
</script>
</body>
</html>
