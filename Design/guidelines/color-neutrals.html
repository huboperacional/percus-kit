<!-- @dsCard group="Colors" viewport="700x160" name="Neutral ramp" subtitle="100–900 on one perceptual lightness scale" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neutral ramp</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; background: var(--bg-app); }
  .row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
</style>
</head>
<body>
<style>
  .sw { display: flex; gap: var(--space-3); flex-wrap: wrap; }
  .chip { width: 104px; }
  .chip i { display: block; height: 46px; border-radius: var(--radius-tile); border: 1px solid var(--border-card); }
  .chip b { display: block; font-size: var(--text-2xs); font-weight: var(--weight-semibold); margin-top: 6px; }
  .chip s { display: block; font-size: var(--text-2xs); color: var(--text-tertiary); text-decoration: none; font-family: ui-monospace, monospace; }

</style>
<div class="sw"><span class="chip"><i style="background:var(--neutral-100)"></i><b>100</b><s>var(--neutral-100)</s></span><span class="chip"><i style="background:var(--neutral-200)"></i><b>200</b><s>var(--neutral-200)</s></span><span class="chip"><i style="background:var(--neutral-300)"></i><b>300</b><s>var(--neutral-300)</s></span><span class="chip"><i style="background:var(--neutral-400)"></i><b>400</b><s>var(--neutral-400)</s></span><span class="chip"><i style="background:var(--neutral-500)"></i><b>500</b><s>var(--neutral-500)</s></span><span class="chip"><i style="background:var(--neutral-600)"></i><b>600</b><s>var(--neutral-600)</s></span><span class="chip"><i style="background:var(--neutral-700)"></i><b>700</b><s>var(--neutral-700)</s></span><span class="chip"><i style="background:var(--neutral-800)"></i><b>800</b><s>var(--neutral-800)</s></span><span class="chip"><i style="background:var(--neutral-900)"></i><b>900</b><s>var(--neutral-900)</s></span></div>
</body>
</html>
