<!-- @dsCard group="Brand" viewport="700x220" name="Accent poster" subtitle="The one place red runs as a field: the sign-in statement" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accent poster</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; background: var(--bg-app); }
  .row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
</style>
</head>
<body>
<style>
  .sw { display: flex; gap: var(--space-3); flex-wrap: wrap; }
  .chip { width: 104px; }
  .chip i { display: block; height: 46px; border-radius: var(--radius-tile); border: 1px solid var(--border-card); }
  .chip b { display: block; font-size: var(--text-2xs); font-weight: var(--weight-semibold); margin-top: 6px; }
  .chip s { display: block; font-size: var(--text-2xs); color: var(--text-tertiary); text-decoration: none; font-family: ui-monospace, monospace; }

</style>
<div style="background:var(--accent);color:var(--text-inverse);border-radius:var(--radius-modal);padding:24px 28px;display:flex;flex-direction:column;gap:16px">
  <span style="font-size:var(--text-2xs);letter-spacing:var(--tracking-kicker);text-transform:uppercase;opacity:.85">Owner access</span>
  <span style="font-family:var(--font-display);font-weight:800;letter-spacing:var(--tracking-display);font-size:var(--text-3xl);line-height:1.08">Swap a photo.<br>Ship it.</span>
  <span style="display:flex;gap:8px"><span style="background:var(--overlay-on-accent);border-radius:var(--radius-pill);padding:6px 12px;font-size:var(--text-xs)">7 sections</span><span style="background:var(--overlay-on-accent);border-radius:var(--radius-pill);padding:6px 12px;font-size:var(--text-xs)">54 fields</span></span>
</div>
</body>
</html>
