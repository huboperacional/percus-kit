<!-- @dsCard group="Spacing" viewport="700x170" name="Radius" subtitle="Pill for controls, 12–24px for surfaces — nothing sharp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radius</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; background: var(--bg-app); }
  .row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
</style>
</head>
<body>
<style>
  .sw { display: flex; gap: var(--space-3); flex-wrap: wrap; }
  .chip { width: 104px; }
  .chip i { display: block; height: 46px; border-radius: var(--radius-tile); border: 1px solid var(--border-card); }
  .chip b { display: block; font-size: var(--text-2xs); font-weight: var(--weight-semibold); margin-top: 6px; }
  .chip s { display: block; font-size: var(--text-2xs); color: var(--text-tertiary); text-decoration: none; font-family: ui-monospace, monospace; }

</style>
<div class="sw"><span class="chip"><i style="background:var(--bg-surface);border-radius:var(--radius-input);box-shadow:var(--shadow-sm)"></i><b>input 10</b><s>var(--radius-input)</s></span><span class="chip"><i style="background:var(--bg-surface);border-radius:var(--radius-tile);box-shadow:var(--shadow-sm)"></i><b>tile 12</b><s>var(--radius-tile)</s></span><span class="chip"><i style="background:var(--bg-surface);border-radius:var(--radius-card);box-shadow:var(--shadow-sm)"></i><b>card 16</b><s>var(--radius-card)</s></span><span class="chip"><i style="background:var(--bg-surface);border-radius:var(--radius-panel);box-shadow:var(--shadow-sm)"></i><b>panel 20</b><s>var(--radius-panel)</s></span><span class="chip"><i style="background:var(--bg-surface);border-radius:var(--radius-modal);box-shadow:var(--shadow-sm)"></i><b>modal 24</b><s>var(--radius-modal)</s></span><span class="chip"><i style="background:var(--bg-surface);border-radius:var(--radius-pill);box-shadow:var(--shadow-sm)"></i><b>pill 999</b><s>var(--radius-pill)</s></span></div>
</body>
</html>
